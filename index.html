<!DOCTYPE html>
<html>
<head>
  <title>Test Case Generator</title>
  
  <style>
    body { font-family: Arial; padding: 20px; }
    textarea { width: 100%; height: 100px; }
    button { margin-top: 10px; }
    #output { margin-top: 20px; white-space: pre-wrap; }
  </style>
</head>
<body>
    <button id="copyBtn" onclick="copyToClipboard()" style="display:none;">Copy Test Cases</button>

  <h1>Test Case Generator</h1>
  <p>Enter your test scenario:</p>
  <textarea id="scenario"></textarea>
  <button onclick="generate()">Generate Test Cases</button>
  <div id="output"></div>
  <script>
    function generate() {
      const scenario = document.getElementById('scenario').value;
      const output = document.getElementById('output');
      const copyBtn = document.getElementById('copyBtn');
  
      if (!scenario.trim()) {
        output.innerText = 'Please enter a scenario.';
        copyBtn.style.display = 'none';
        return;
      }
  
      const result = `Test Cases for: ${scenario}\n\n` +
        `1. Verify ${scenario} with valid input\n` +
        `2. Check ${scenario} with invalid input\n` +
        `3. Ensure ${scenario} handles edge cases\n` +
        `4. Confirm ${scenario} logs errors properly\n` +
        `5. Validate ${scenario} meets expected output`;
  
      output.innerText = result;
      copyBtn.style.display = 'inline-block';
    }
  
    function copyToClipboard() {
      const text = document.getElementById('output').innerText;
      navigator.clipboard.writeText(text).then(() => {
        alert('Test cases copied to clipboard!');
      });
    }
  </script>
  
</body>
</html>
